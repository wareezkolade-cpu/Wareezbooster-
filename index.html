<body class="bg-white">
<!-- Header -->
<div class="sticky top-0 z-50 bg-white border-b border-gray-200 px-4 py-3 flex justify-between items-center shadow-sm">
<div class="flex items-center gap-3 pressable"><i class="fas fa-bars text-[#FF00AA] text-xl p-2"></i><img src="icons/wareez-crown-logo.png" class="w-10 h-10 rounded-full border-2 border-[#FFD700]"><div class="leading-none"><h1 class="font-black text-[19px] text-[#0A3DFF]">WAREEZ <span class="text-[#FFD700]">BOOSTER</span></h1><p class="text-[8px] font-bold text-gray-500 tracking-widest">PRESSABLE V12 👑</p></div></div>
<div class="flex items-center gap-2 pressable"><div class="flex items-center bg-gray-100 rounded-full pr-3 py-1"><div class="w-9 h-9 bg-green-500 rounded-full flex items-center justify-center text-white"><i class="fas fa-plus text-sm"></i></div><span class="text-sm font-bold ml-1">0 NGN</span></div><span class="font-bold">EN <i class="fas fa-caret-down text-xs"></i></span></div>
</div>

<!-- Social Picker - BIG PRESSABLE -->
<div class="pink-bg border-b-2 border-[#FF00AA] py-7 px-4">
<h2 class="text-center font-black text-[20px] mb-6 tracking-wide">PICK YOUR TARGET SOCIAL MEDIA:</h2>
<div class="flex justify-center gap-4 flex-wrap max-w-3xl mx-auto">
<button onclick="pickSocial('instagram')" id="btn-instagram" class="social-icon active w-20 h-20 bg-white rounded-2xl flex items-center justify-center shadow-lg pressable"><div class="w-14 h-14 rounded-xl bg-gradient-to-br from-purple-600 via-pink-500 to-yellow-400 flex items-center justify-center"><i class="fab fa-instagram text-white text-3xl"></i></div></button>
<button onclick="pickSocial('tiktok')" id="btn-tiktok" class="social-icon w-20 h-20 bg-white rounded-2xl flex items-center justify-center shadow-md pressable"><div class="w-14 h-14 bg-black rounded-xl flex items-center justify-center"><i class="fab fa-tiktok text-white text-3xl"></i></div></button>
<button onclick="pickSocial('telegram')" id="btn-telegram" class="social-icon w-20 h-20 bg-white rounded-2xl flex items-center justify-center shadow-md pressable"><div class="w-14 h-14 bg-[#2AABEE] rounded-xl flex items-center justify-center"><i class="fab fa-telegram-plane text-white text-2xl"></i></div></button>
<button onclick="pickSocial('facebook')" id="btn-facebook" class="social-icon w-20 h-20 bg-white rounded-2xl flex items-center justify-center shadow-md pressable"><div class="w-14 h-14 bg-blue-600 rounded-xl flex items-center justify-center"><i class="fab fa-facebook-f text-white text-2xl"></i></div></button>
<button onclick="pickSocial('youtube')" id="btn-youtube" class="social-icon w-20 h-20 bg-white rounded-2xl flex items-center justify-center shadow-md pressable"><div class="w-14 h-14 bg-red-600 rounded-xl flex items-center justify-center"><i class="fab fa-youtube text-white text-2xl"></i></div></button>
<button onclick="pickSocial('whatsapp')" id="btn-whatsapp" class="social-icon w-20 h-20 bg-white rounded-2xl flex items-center justify-center shadow-md pressable"><div class="w-14 h-14 bg-green-500 rounded-full flex items-center justify-center"><i class="fab fa-whatsapp text-white text-3xl"></i></div></button>
</div>
<p id="selectedPlatform" class="text-center mt-5 font-black text-[#FF00AA] text-sm">📸 INSTAGRAM SELECTED - Tap any icon above</p>
</div>

<div class="max-w-2xl mx-auto px-4 py-6 space-y-6">

<!-- Service -->
<div class="bg-white"><label class="font-black text-gray-700 text-[15px]">Service: <span class="text-[#FF00AA]">*</span></label><select id="service" onchange="updateServices()" class="pressable w-full mt-2 border-2 border-gray-300 rounded-xl p-4 font-bold text-[16px] outline-none focus:border-[#FF00AA] focus:ring-2 focus:ring-[#FF00AA]/20 bg-white"><option value="followers">Followers</option><option value="likes">Likes / Post Likes / Video Likes</option><option value="views">Views / Video Views / Story Views</option><option value="comments">Comments / Custom Comments</option><option value="reposts">Reposts</option><option value="page_followers">Page Followers / Members</option><option value="reactions">Reactions</option><option value="livestream">Livestream</option></select></div>

<!-- Type - PRESSABLE -->
<div class="bg-yellow-50 border-2 border-yellow-200 rounded-2xl p-3">
<label class="font-black text-gray-700 text-[15px]">Type: <span class="text-[#FF00AA]">*</span> <span class="text-xs font-normal opacity-70">(Tap to change - EXACT EXO PRICE)</span></label>
<select id="type" onchange="updatePrice()" class="pressable w-full mt-2 border-2 border-[#FFD700] rounded-xl p-4 font-bold text-[16
